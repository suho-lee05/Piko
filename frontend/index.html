<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piko 회원가입 / 로그인</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 40px 16px;
        background: #f5f5f7;
        color: #222;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      }
      h1 {
        text-align: center;
        margin-bottom: 24px;
      }
      h2 {
        margin-top: 0;
      }
      label {
        display: block;
        font-size: 14px;
        margin: 12px 0 6px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
      }
      button {
        margin-top: 16px;
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-size: 15px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .result {
        margin-top: 12px;
        font-size: 13px;
        background: #f7f7f7;
        padding: 10px;
        border-radius: 8px;
        white-space: pre-wrap;
      }
      .token {
        word-break: break-all;
      }
      @media (max-width: 800px) {
        .container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Piko 회원가입 / 로그인</h1>
    <div class="container">
      <div class="card">
        <h2>회원가입</h2>
        <form id="registerForm">
          <label for="regEmail">이메일</label>
          <input id="regEmail" type="email" required />

          <label for="regUserName">닉네임</label>
          <input id="regUserName" type="text" required />

          <label for="regPassword">비밀번호</label>
          <input id="regPassword" type="password" required />

          <label for="regPhone">전화번호</label>
          <input id="regPhone" type="text" />

          <label for="regAddress">주소</label>
          <input id="regAddress" type="text" />

          <button type="submit">회원가입</button>
        </form>
        <div id="registerResult" class="result"></div>
      </div>

      <div class="card">
        <h2>로그인</h2>
        <form id="loginForm">
          <label for="loginEmail">이메일</label>
          <input id="loginEmail" type="email" required />

          <label for="loginPassword">비밀번호</label>
          <input id="loginPassword" type="password" required />

          <button type="submit">로그인</button>
        </form>
        <div id="loginResult" class="result"></div>
      </div>
    </div>

    <script>
      const API_BASE = "http://localhost:5000/api/auth";

      function setResult(el, data) {
        el.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
      }

      document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const resultEl = document.getElementById("registerResult");
        setResult(resultEl, "요청 중...");

        const payload = {
          email: document.getElementById("regEmail").value,
          userName: document.getElementById("regUserName").value,
          password: document.getElementById("regPassword").value,
          phoneNumber: document.getElementById("regPhone").value || null,
          roadAddress: document.getElementById("regAddress").value || null,
        };

        try {
          const res = await fetch(`${API_BASE}/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          setResult(resultEl, data);
        } catch (err) {
          setResult(resultEl, err.message);
        }
      });

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const resultEl = document.getElementById("loginResult");
        setResult(resultEl, "요청 중...");

        const payload = {
          email: document.getElementById("loginEmail").value,
          password: document.getElementById("loginPassword").value,
        };

        try {
          const res = await fetch(`${API_BASE}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          setResult(resultEl, data);
        } catch (err) {
          setResult(resultEl, err.message);
        }
      });
    </script>
  </body>
</html>
